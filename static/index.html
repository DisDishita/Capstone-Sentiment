<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #container {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
            width: 400px;
        }
        textarea {
            width: 100%;
            border-radius: 6px;
            padding: 10px;
            font-size: 16px;
            resize: none;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: #4CAF50;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h2>Sentiment Analysis</h2>
        <textarea id="userText" rows="4" placeholder="Type your text here..."></textarea><br>
        <button onclick="analyze()">Analyze Sentiment</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
